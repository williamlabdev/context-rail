# ContextRail CI: the same checks every Evidence Bundle records, run on
# every push and pull request — Go vet + tests, frontend typecheck/build/unit
# tests, and the Playwright browser journeys against a freshly built server
# with a throw-away governance state directory. The consumer fixtures are
# hashed before and after the browser run: they must never change.
name: ci
on:
  pull_request:
  push:
    branches: [develop, "feat/**", "docs/**", "chore/**"]
permissions:
  contents: read
jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  browser:
    name: browser
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build workspace and server
        run: |
          cd frontend && npm ci && npm run build && cd ..
          go build -o bin/context-rail ./cmd/context-rail
      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Hash consumer fixtures (before)
        run: |
          find demo/order-operations-portal examples/support-insights -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-64 > /tmp/fixtures-before
          cat /tmp/fixtures-before
      - name: Start server
        run: |
          PORT=8080 CONTEXT_RAIL_FIXTURE_ROOTS=demo/order-operations-portal,examples/support-insights \
          CONTEXT_RAIL_STATIC_DIR=frontend/dist CONTEXT_RAIL_STATE_DIR="$RUNNER_TEMP/state" \
          nohup ./bin/context-rail > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
      - name: Browser journeys
        run: |
          cd frontend
          BASE_URL=http://127.0.0.1:8080 npm run test:e2e -- --reporter=list 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Hash consumer fixtures (after) — must be identical
        run: |
          find demo/order-operations-portal examples/support-insights -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-64 > /tmp/fixtures-after
          diff /tmp/fixtures-before /tmp/fixtures-after && echo "consumer fixtures unchanged"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Browser journeys"
            echo
            echo '```'
            grep -E "^ +[✓✘-] |passed|failed|flaky|skipped|did not run" "$RUNNER_TEMP/e2e.log" || echo "no journey output"
            echo '```'
            echo
            echo "Consumer fixture tree hash before: \`$(cat /tmp/fixtures-before)\` · after: \`$(cat /tmp/fixtures-after 2>/dev/null || echo unavailable)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Server log
        if: always()
        run: tail -n 50 "$RUNNER_TEMP/server.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore
