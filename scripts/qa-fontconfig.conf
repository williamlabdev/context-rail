<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The bundled LibreOffice runtime does not recursively discover the
       macOS Supplemental fonts. Keep this QA-only config explicit so CJK
       document renders are reproducible. -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>/private/tmp/hg-fontconfig-cache</cachedir>
</fontconfig>
